<!DOCTYPE html>
<html>
  <head>

    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      
      <a-entity environment="preset: forest; ground: flat; groundColor: #ffffff; groundColor2: #e6eef7; skyType: gradient; skyColor: #9bb5d6; horizonColor: #e8f0f8; fog: 0.6; dressingColor: #dfeaf5; dressingAmount: 60"></a-entity>

    
      <a-entity position="0 0 -5">
        <!-- snowmannnnnn -->
        <a-sphere position="0 1 0" radius="2" color="#ffffff"></a-sphere>
        <a-sphere position="0 2.6 0" radius="0.7" color="#ffffff"></a-sphere>
        <a-sphere position="0 3.65 0" radius="0.45" color="#ffffff"></a-sphere>

        <!-- lil face -->
        <a-cone position="0 3.6 0.55" rotation="90 0 0" height="0.4" radius-bottom="0.07" color="#ff7b00"></a-cone>
        <a-sphere position="-0.15 3.78 0.41" radius="0.06" color="#000000"></a-sphere>
        <a-sphere position="0.15 3.78 0.41" radius="0.05" color="#000000"></a-sphere>
        
        <!-- ARE YOU KIDDING LOOK AT HIS SCARF-->
        <a-torus position="0 3.25 0" rotation="90 0 0" radius="0.33" radius-tubular="0.1" color="#d62828"></a-torus>
<a-box position="0.2 2.95 0.6" width="0.18" height="0.6" depth="0.06" color="#d62828"></a-box>
        
      
      </a-entity>
    </a-scene>

</html>
