<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unreal Summer World</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- ASSETS: put these image files in the same folder as index.html
           (or change the paths). Swap in your own textures! -->
      <a-assets>
        <img id="sky" src="sky.jpg" />          <!-- your edited equirectangular image -->
        <img id="sand" src="sand.jpg" />        <!-- sand texture -->
        <img id="wood" src="wood.jpg" />        <!-- wood planks texture -->
        <img id="water" src="water.jpg" />      <!-- ocean texture -->
        <img id="stripes" src="stripes.jpg" />  <!-- umbrella stripes / any bright pattern -->
        <img id="waffle" src="waffle.jpg" />    <!-- waffle cone texture -->
      </a-assets>
 
      <!-- SKY (Step 2) -->
      <a-sky src="#sky" color="#87ceeb"></a-sky>
 
      <!-- GROUND: sand -->
      <a-plane src="#sand" repeat="20 20" color="#f2d9a0"
               rotation="-90 0 0" width="60" height="60"></a-plane>
 
      <!-- OCEAN -->
      <a-plane src="#water" repeat="10 4" color="#2a8fd6"
               position="0 0.02 -28" rotation="-90 0 0" width="60" height="20"></a-plane>
 
      <!-- OBJECT 1: BOARDWALK -->
      <a-box src="#wood" repeat="2 8" color="#b5835a"
             position="-6 0.1 -6" width="3" height="0.2" depth="16"></a-box>
      <!-- railing posts -->
      <a-cylinder src="#wood" color="#8b5a2b" radius="0.08" height="1" position="-4.6 0.7 -12"></a-cylinder>
      <a-cylinder src="#wood" color="#8b5a2b" radius="0.08" height="1" position="-4.6 0.7 -9"></a-cylinder>
      <a-cylinder src="#wood" color="#8b5a2b" radius="0.08" height="1" position="-4.6 0.7 -6"></a-cylinder>
      <a-cylinder src="#wood" color="#8b5a2b" radius="0.08" height="1" position="-4.6 0.7 -3"></a-cylinder>
      <a-cylinder src="#wood" color="#8b5a2b" radius="0.08" height="1" position="-4.6 0.7 0"></a-cylinder>
      <!-- railing bar -->
      <a-box src="#wood" color="#8b5a2b" position="-4.6 1.15 -6" width="0.1" height="0.1" depth="12.2"></a-box>
 
      <!-- OBJECT 2: SANDCASTLE -->
      <a-entity position="0 0 -5">
        <!-- main block -->
        <a-box src="#sand" color="#e6c27a" position="0 0.5 0" width="2" height="1" depth="2"></a-box>
        <!-- center tower -->
        <a-cylinder src="#sand" color="#e6c27a" position="0 1.4 0" radius="0.5" height="1.2"></a-cylinder>
        <a-cone src="#sand" color="#d9b26a" position="0 2.4 0" radius-bottom="0.6" radius-top="0" height="0.9"></a-cone>
        <!-- corner towers -->
        <a-cylinder src="#sand" color="#e6c27a" position="-1 0.8 -1" radius="0.3" height="1.6"></a-cylinder>
        <a-cylinder src="#sand" color="#e6c27a" position="1 0.8 -1" radius="0.3" height="1.6"></a-cylinder>
        <a-cylinder src="#sand" color="#e6c27a" position="-1 0.8 1" radius="0.3" height="1.6"></a-cylinder>
        <a-cylinder src="#sand" color="#e6c27a" position="1 0.8 1" radius="0.3" height="1.6"></a-cylinder>
        <a-cone src="#sand" color="#d9b26a" position="-1 1.85 -1" radius-bottom="0.38" radius-top="0" height="0.5"></a-cone>
        <a-cone src="#sand" color="#d9b26a" position="1 1.85 -1" radius-bottom="0.38" radius-top="0" height="0.5"></a-cone>
        <a-cone src="#sand" color="#d9b26a" position="-1 1.85 1" radius-bottom="0.38" radius-top="0" height="0.5"></a-cone>
        <a-cone src="#sand" color="#d9b26a" position="1 1.85 1" radius-bottom="0.38" radius-top="0" height="0.5"></a-cone>
        <!-- little flag -->
        <a-cylinder color="#555" position="0 3.05 0" radius="0.02" height="0.6"></a-cylinder>
        <a-triangle color="#ff4d6d" position="0.2 3.2 0" scale="0.3 0.25 1"></a-triangle>
      </a-entity>
 
      <!-- OBJECT 3: BEACH UMBRELLA -->
      <a-entity position="4 0 -5">
        <a-cylinder color="#eeeeee" position="0 1.2 0" radius="0.06" height="2.4"></a-cylinder>
        <a-cone src="#stripes" color="#ff6b6b" position="0 2.6 0"
                radius-bottom="1.6" radius-top="0" height="0.8"></a-cone>
        <!-- beach towel under it -->
        <a-box src="#stripes" color="#ffd93d" position="0 0.02 0.8" width="1.2" height="0.02" depth="2"></a-box>
      </a-entity>
 
      <!-- OBJECT 4: ICE CREAM CONE -->
      <a-entity position="-2.5 0 -3">
        <!-- cone (flipped so the tip points down) -->
        <a-cone src="#waffle" color="#e0a85c" position="0 0.6 0" rotation="180 0 0"
                radius-bottom="0.3" radius-top="0" height="1.2"></a-cone>
        <!-- scoops -->
        <a-sphere color="#ff9ecf" position="0 1.4 0" radius="0.38"></a-sphere>
        <a-sphere color="#fff3b0" position="0 1.85 0" radius="0.32"></a-sphere>
        <!-- cherry -->
        <a-sphere color="#c1121f" position="0 2.22 0" radius="0.1"></a-sphere>
      </a-entity>
 
      <!-- Sun -->
      <a-sphere color="#fff176" position="10 15 -30" radius="2"
                material="shader: flat"></a-sphere>
 
      <!-- Light -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#fff4d6" intensity="0.6" position="5 10 5"></a-light>
 
      <!-- Camera -->
      <a-entity position="0 1.6 2">
        <a-camera></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
