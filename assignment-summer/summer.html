<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unreal Summer World</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      
      <a-assets>
        <img id="sky" src="../assignment-summer/images/sky.jpg" />          
        <img id="sand" src="../assignment-summer/images/sand.jpg" />       
        <img id="wood" src="../assignment-summer/images/wood.jpg" />       
        <img id="water" src="../assignment-summer/images/water.jpg" />     
        <img id="stripes" src="../assignment-summer/images/stripes.jpg" /> 
        <img id="waffle" src="../assignment-summer/images/waffle.jpg" />    
      </a-assets>

      <!-- pinterest sky -->
      <a-sky src="#sky" color="#87ceeb"></a-sky>

      <!-- clipart sand -->
      <a-plane src="#sand" repeat="20 20" color="#f2d9a0"
               rotation="-90 0 0" width="60" height="60"></a-plane>

      <!-- clitpart water -->
      <a-plane src="#water" repeat="10 4" color="#2a8fd6"
               position="0 0.02 -28" rotation="-90 0 0" width="60" height="20"></a-plane>

      <!-- boardwalk -->
      <a-box src="#wood" repeat="2 8" color="#b5835a"
             position="-6 0.1 -6" width="3" height="0.2" depth="16"></a-box>
    
      <!-- sandcastelleeeee -->
      <a-entity position="0 0 -5">
        <!-- main block -->
        <a-box src="#sand" color="#e6c27a" position="0 0.5 0" width="2" height="1" depth="2"></a-box>
        <!-- center tower -->
        <a-cylinder src="#sand" color="#e6c27a" position="0 1.4 0" radius="0.5" height="1.2"></a-cylinder>
        <a-cone src="#sand" color="#d9b26a" position="0 2.4 0" radius-bottom="0.6" radius-top="0" height="0.9"></a-cone>
        <!-- corner towers -->
        <a-cylinder src="#sand" color="#e6c27a" position="-1 0.8 -1" radius="0.3" height="1.6"></a-cylinder>
        <a-cylinder src="#sand" color="#e6c27a" position="1 0.8 -1" radius="0.3" height="1.6"></a-cylinder>
        <a-cylinder src="#sand" color="#e6c27a" position="-1 0.8 1" radius="0.3" height="1.6"></a-cylinder>
        <a-cylinder src="#sand" color="#e6c27a" position="1 0.8 1" radius="0.3" height="1.6"></a-cylinder>
        <a-cone src="#sand" color="#d9b26a" position="-1 1.85 -1" radius-bottom="0.38" radius-top="0" height="0.5"></a-cone>
        <a-cone src="#sand" color="#d9b26a" position="1 1.85 -1" radius-bottom="0.38" radius-top="0" height="0.5"></a-cone>
        <a-cone src="#sand" color="#d9b26a" position="-1 1.85 1" radius-bottom="0.38" radius-top="0" height="0.5"></a-cone>
        <a-cone src="#sand" color="#d9b26a" position="1 1.85 1" radius-bottom="0.38" radius-top="0" height="0.5"></a-cone>
        

      <!-- umberlla -->
      <a-entity position="4 0 -5">
        <a-cylinder color="#eeeeee" position="0 1.2 0" radius="0.06" height="2.4"></a-cylinder>
        <a-cone src="#stripes" color="#ff6b6b" position="0 2.6 0"
                radius-bottom="1.6" radius-top="0" height="0.8"></a-cone>
        <!-- beach under little crab -->
        <a-box src="#stripes" color="#ffd93d" position="0 0.02 0.8" width="1.2" height="0.02" depth="2"></a-box>
      </a-entity>

      

      <!-- ===== CRAB BEACH PARTY ===== -->

      <!-- BEACH CHAIR -->
      <a-entity position="2.2 0 -1.5" rotation="0 -15 0">
        <a-box src="#stripes" color="#4dabf7" position="0 0.4 0" width="0.9" height="0.08" depth="0.9"></a-box>
        <a-box src="#stripes" color="#4dabf7" position="0 0.85 -0.5" rotation="-20 0 0" width="0.9" height="0.9" depth="0.08"></a-box>
        <a-cylinder color="#eeeeee" position="-0.4 0.2 0.4" radius="0.04" height="0.4"></a-cylinder>
        <a-cylinder color="#eeeeee" position="0.4 0.2 0.4" radius="0.04" height="0.4"></a-cylinder>
        <a-cylinder color="#eeeeee" position="-0.4 0.2 -0.4" radius="0.04" height="0.4"></a-cylinder>
        <a-cylinder color="#eeeeee" position="0.4 0.2 -0.4" radius="0.04" height="0.4"></a-cylinder>
      <!-- crab with his lil pina colada!!! -->
      <a-entity position="0 0.44 0" rotation="0 0 0" scale="1.3 1.3 1.3" >
        <a-sphere color="#e8452c" position="0 0.2 0" radius="0.3" scale="1.3 0.6 1"></a-sphere>
        <!-- eyes -->
        <a-cylinder color="#c73a24" position="-0.1 0.42 0.2" radius="0.02" height="0.15"></a-cylinder>
        <a-cylinder color="#c73a24" position="0.1 0.42 0.2" radius="0.02" height="0.15"></a-cylinder>
        <a-sphere color="#ffffff" position="-0.1 0.52 0.2" radius="0.05"></a-sphere>
        <a-sphere color="#ffffff" position="0.1 0.52 0.2" radius="0.05"></a-sphere>
        <a-sphere color="#000000" position="-0.1 0.52 0.245" radius="0.025"></a-sphere>
        <a-sphere color="#000000" position="0.1 0.52 0.245" radius="0.025"></a-sphere>
        <!-- claws -->
        <a-sphere color="#ff5a3c" position="-0.4 0.45 0.3" radius="0.12" scale="1 0.8 1.2"></a-sphere>
        <a-sphere color="#ff5a3c" position="0.4 0.3 0.3" radius="0.12" scale="1 0.8 1.2"></a-sphere>
        <!-- legs -->
        <a-cylinder color="#c73a24" position="-0.35 0.1 -0.1" rotation="0 0 -50" radius="0.02" height="0.3"></a-cylinder>
        <a-cylinder color="#c73a24" position="0.35 0.1 -0.1" rotation="0 0 50" radius="0.02" height="0.3"></a-cylinder>
        <a-cylinder color="#c73a24" position="-0.35 0.1 0.05" rotation="0 0 -50" radius="0.02" height="0.3"></a-cylinder>
        <a-cylinder color="#c73a24" position="0.35 0.1 0.05" rotation="0 0 50" radius="0.02" height="0.3"></a-cylinder>
        <a-cylinder color="#c73a24" position="-0.35 0.1 0.2" rotation="0 0 -50" radius="0.02" height="0.3"></a-cylinder>
        <a-cylinder color="#c73a24" position="0.35 0.1 0.2" rotation="0 0 50" radius="0.02" height="0.3"></a-cylinder>
        <!-- sunglasses -->
        <a-box color="#111111" position="-0.1 0.52 0.26" width="0.14" height="0.09" depth="0.03"></a-box>
        <a-box color="#111111" position="0.1 0.52 0.26" width="0.14" height="0.09" depth="0.03"></a-box>
        <a-box color="#111111" position="0 0.54 0.26" width="0.08" height="0.02" depth="0.03"></a-box>
        <!-- pina colada held in the raised claw -->
        <a-cylinder color="#fff6c9" position="-0.4 0.72 0.3" radius="0.09" height="0.3"></a-cylinder>
        <a-cylinder color="#ff5fa2" position="-0.37 0.95 0.3" radius="0.012" height="0.25" rotation="0 0 10"></a-cylinder>
        <a-box color="#ffd93d" position="-0.3 0.88 0.3" width="0.12" height="0.1" depth="0.03" rotation="0 0 -20"></a-box>
        <a-cone color="#e63946" position="-0.45 0.92 0.3" radius-bottom="0.1" radius-top="0" height="0.08"></a-cone>
      </a-entity>

      </a-entity>

      <!-- Sun -->
      <a-sphere color="#fff176" position="10 15 -30" radius="2"
                material="shader: flat"></a-sphere>

      <!-- Light -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#fff4d6" intensity="0.6" position="5 10 5"></a-light>

      <!-- Camera -->
      <a-entity position="0 1.6 2">
        <a-camera></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
